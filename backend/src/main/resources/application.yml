server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: yunshu-zhixue
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    portal:
      issuer: yunshu-zhixue-portal
      secret: ${APP_JWT_PORTAL_SECRET:yunshu-zhixue-portal-token-secret-2026-dev-only}
      access-ttl: 2h
      refresh-ttl: 14d
    admin:
      issuer: yunshu-zhixue-admin
      secret: ${APP_JWT_ADMIN_SECRET:yunshu-zhixue-admin-token-secret-2026-dev-only}
      access-ttl: 2h
      refresh-ttl: 14d
  default-password: ${APP_DEFAULT_PASSWORD:Admin@123456}
  admin-init:
    enabled: ${APP_ADMIN_INIT_ENABLED:true}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:yszx}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: 60
